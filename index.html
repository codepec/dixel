<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dixel</title>

  <!-- Styles -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Theme -->
  <meta name="theme-color" content="#2563eb">

  <script>
    // APPLY DARK MODE BEFORE PAGE LOAD (no flicker)
    if (localStorage.getItem("darkMode") === "true") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
</head>

<body>

  <!-- NAV -->
  <nav class="navbar">
    <select id="navDropdown">
      <option value="./index" selected>Home</option>
      <option value="./pages/settings.html">Settings</option>
      <option value="./pages/instructions.html">Get Started</option>
    </select>
  </nav>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <img src="./img/icon_trans.png" alt="">
      <h1>Dixel</h1>
    </div>
    <p>Resize images instantly</p>
  </header>

  <main class="container">

    <!-- DROP AREA -->
    <section class="card">
      <h2>Upload</h2>
      <div id="drop-area"
           ondrop="dropHandler(event);"
           ondragover="dragOverHandler(event);"
           ondragleave="dragLeaveHandler(event);">

        <p class="drop-title">Drop image here</p>
        <p class="drop-sub">or click to upload</p>

        <a href="#" id="fileSelect">browse</a>
        <input type="file" id="fileElem" multiple accept="image/*" style="display:none;">
      </div>
    </section>

    <!-- SIZE -->
    <section class="card">
      <h2>Size</h2>
      <div class="radio-group">

        <input type="radio" id="small" name="size" value="small">
        <label for="small">Small</label>

        <input type="radio" id="medium" name="size" value="medium">
        <label for="medium">Medium</label>

        <input type="radio" id="large" name="size" value="large" checked>
        <label for="large">Large</label>

        <input type="radio" id="xlarge" name="size" value="xlarge">
        <label for="xlarge">XXL</label>

        <input type="radio" id="mobile" name="size" value="mobile">
        <label for="mobile">Mobile</label>

        <input type="radio" id="custom" name="size" value="custom">
        <label for="custom">Custom</label>
      </div>

      <!-- CUSTOM SIZE -->
      <div id="customSizeContainer" style="display:none;">
        <input type="text" id="width" placeholder="Width">
        <input type="text" id="height" placeholder="Height">
      </div>
    </section>

    <!-- QUALITY -->
    <section class="card">
      <h2>Quality</h2>
      <div class="slider">
        <span>Low</span>
        <input type="range" id="qualitySlider" min="0.5" max="1.0" step="0.1" value="0.9">
        <span>High</span>
        <span id="qualityValue">90%</span>
      </div>
    </section>

    <!-- RENAME -->
    <section class="card">
      <h2>Filename (optional)</h2>
      <input type="text" id="newFileName" placeholder="my_image.jpg">
    </section>

    <!-- PROGRESS -->
    <div id="progress-container">
      <div id="progress-bar">0%</div>
    </div>

    <button class="actionBtn" id="clearQueue">Clear Queue</button>

    <!-- RESULT TABLE -->
    <section>
      <h2 id="resizedImages">Resized Images</h2>
      <table id="image-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Width</th>
            <th>Height</th>
            <th>Original (KB)</th>
            <th>New (KB)</th>
            <th>Compression</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <footer>
      <a class="footerA" href="./pages/imprint.html">Imprint</a> 
      <a class="footerA" href="./pages/privacy.html">Privacy Policy</a>
      <a class="footerA" href="./pages/disclaimer.html">Disclaimer</a>
    </footer>

  </main>

  <!-- Hidden download -->
  <a id="downloadLink" style="display:none"></a>

  <!-- 🔥 SCRIPTS -->
  <script src="./js/libs/jszip.min.js"></script>
  <script src="./js/script.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/sw.js"></script>
  <script src="./js/worker.js"></script>

  <!-- NAV DROPDOWN -->
  <script>
    document.getElementById("navDropdown").addEventListener("change", function () {
      window.location.href = this.value;
    });

    // File select click
    document.getElementById("fileSelect").onclick = function (e) {
      e.preventDefault();
      document.getElementById("fileElem").click();
    };

    document.getElementById("fileElem").addEventListener("change", function () {
      handleFiles(this.files);
    });
  </script>

</body>
</html>
