<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dixel Settings</title>

  <meta name="theme-color" content="#2563eb">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="settings.css">
</head>

<body>

  <!-- NAV -->
  <nav class="navbar">
    <select id="navDropdown">
      <option value="../index.html">Home</option>
      <option value="./settings.html" selected>Settings</option>
      <option value="./instructions.html">Get Started</option>
    </select>
  </nav>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <img src="../img/icon_trans.png" alt="">
      <h1>Dixel</h1>
    </div>
    <p>Resize images instantly</p>
  </header>

  <!-- SETTINGS -->
  <div class="settings-wrapper">

    <h2 class="settings-title">Settings</h2>

    <div class="settings-container">

      <!-- LANGUAGE -->
      <div class="settings-item">
        <label>Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </div>

      <!-- DARK MODE -->
      <div class="settings-item toggle-container">
        <p>Dark Mode</p>
        <input type="checkbox" id="darkModeToggle">
        <label for="darkModeToggle"></label>
      </div>

      <!-- OFFLINE MODE -->
      <div class="settings-item toggle-container">
        <p>Offline Mode</p>
        <input type="checkbox" id="offlineModeToggle">
        <label for="offlineModeToggle"></label>
      </div>

    </div>

  </div>
      <footer>
      <a href="imprint.html">Imprint</a> |
      <a href="privacy.html">Privacy Policy</a>
    </footer>


  <!-- EXISTING SCRIPTS -->

  <script src="../js/offline.js"></script>


  <!-- 🔥 CORE LOGIC (NEU & STABIL) -->
 <script>
document.addEventListener("DOMContentLoaded", () => {

  const darkToggle = document.getElementById("darkModeToggle");
  const offlineToggle = document.getElementById("offlineModeToggle");
  const languageSelect = document.getElementById("languageSelect");
  const nav = document.getElementById("navDropdown");

  // NAV
  if (nav) {
    nav.addEventListener("change", function () {
      window.location.href = this.value;
    });
  }

  // LOAD SETTINGS
  const darkMode = localStorage.getItem("darkMode") === "true";
  document.body.classList.toggle("dark-mode", darkMode);
  if (darkToggle) darkToggle.checked = darkMode;

  const offlineMode = localStorage.getItem("offlineMode") === "true";
  if (offlineToggle) offlineToggle.checked = offlineMode;

  const lang = localStorage.getItem("language") || "en";
  if (languageSelect) languageSelect.value = lang;

  // EVENTS
  if (darkToggle) {
    darkToggle.addEventListener("change", () => {
      const enabled = darkToggle.checked;
      document.body.classList.toggle("dark-mode", enabled);
      localStorage.setItem("darkMode", enabled);
    });
  }

  if (offlineToggle) {
    offlineToggle.addEventListener("change", () => {
      localStorage.setItem("offlineMode", offlineToggle.checked);
    });
  }

  if (languageSelect) {
    languageSelect.addEventListener("change", () => {
      const lang = languageSelect.value;
      localStorage.setItem("language", lang);

      if (typeof changeLanguage === "function") {
        changeLanguage();
      }
    });
  }

});
</script>

</body>
</html>
